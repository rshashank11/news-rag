[project]
name = "news-rag-app"
version = "0.1.0"
description = "News RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "opensearch-py>=2.7.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "requests>=2.32.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
