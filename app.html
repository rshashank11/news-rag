<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuintScope</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-soft: #f3f4f6;
      --ink: #111827;
      --text: #374151;
      --muted: #6b7280;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --accent: #2563eb;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      outline-offset: 3px;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 248, 250, 0.92);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-inner {
      max-width: 1220px;
      height: 100%;
      margin: 0 auto;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 28px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.04em;
      white-space: nowrap;
      color: var(--ink);
    }

    .divider {
      width: 1px;
      height: 30px;
      background: var(--line);
      flex: 0 0 auto;
    }

    .source-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .source-tab {
      position: relative;
      min-width: 118px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #4b5563;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.055em;
      white-space: nowrap;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .source-tab input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .source-tab:hover {
      background: #f0f2f5;
      color: var(--ink);
    }

    .source-tab:has(input:checked),
    .source-tab.active {
      border-color: var(--line);
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .top-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #4b5563;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .icon-button:hover {
      color: var(--ink);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.35), transparent 22%),
        linear-gradient(135deg, #07111f, #21475d 45%, #0c1724);
      border: 1px solid #0f172a;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 52px 24px 178px;
    }

    .home {
      width: min(100%, 780px);
    }

    .hero {
      text-align: center;
      margin: 0 auto;
    }

    .sparkle {
      width: 50px;
      height: 50px;
      margin: 0 auto 28px;
      border-radius: 13px;
      background: #0f172a;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.14);
    }

    .hero h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(34px, 4.5vw, 47px);
      line-height: 1.05;
      font-weight: 760;
      letter-spacing: 0.025em;
    }

    .hero-copy {
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
      font-weight: 420;
      letter-spacing: 0.035em;
    }

    .prompt-grid {
      margin: 22px auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .prompt-card {
      min-height: 94px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.74);
      border-radius: 9px;
      box-shadow: 0 3px 9px rgba(15, 23, 42, 0.035);
      padding: 16px 16px 14px;
      text-align: left;
      color: var(--ink);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
    }

    .prompt-card-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
    }

    .prompt-card strong {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 760;
      letter-spacing: 0.02em;
    }

    .prompt-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.38;
      letter-spacing: 0.02em;
    }

    .chat-stream {
      display: none;
      margin-top: 48px;
    }

    .chat-stream.visible {
      display: block;
    }

    .message {
      margin: 0 0 24px;
    }

    .user-bubble {
      margin-left: auto;
      max-width: 78%;
      border: 1px solid var(--line);
      border-radius: 16px 16px 4px 16px;
      background: #ffffff;
      padding: 14px 16px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
    }

    .process {
      margin: 20px 0 26px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.7);
      padding: 14px 16px;
      color: var(--text);
      font-size: 13px;
    }

    .process summary {
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
    }

    .process summary::-webkit-details-marker {
      display: none;
    }

    .process-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .process-item {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 9px;
      align-items: start;
    }

    .process-item.active .process-icon {
      animation: pulse 0.9s ease-in-out infinite;
    }

    .process-icon {
      color: var(--accent);
      font-size: 12px;
      line-height: 1.4;
    }

    .process-name {
      font-size: 13px;
      font-weight: 750;
      color: var(--ink);
    }

    .process-detail {
      margin-top: 5px;
      border-left: 3px solid var(--line);
      padding-left: 10px;
      color: #5f6673;
      font-size: 13px;
      line-height: 1.5;
    }

    .source-strip,
    .planning-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 230px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 650;
    }

    .source-chip span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-chip .mark {
      color: var(--accent);
      font-weight: 800;
    }

    .assistant-block {
      color: var(--text);
      font-size: 16px;
      line-height: 1.72;
    }

    .assistant-block h2 {
      margin: 28px 0 12px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.22;
      font-weight: 780;
      letter-spacing: -0.02em;
    }

    .assistant-block h2:first-child {
      margin-top: 0;
    }

    .assistant-block h3 {
      margin: 22px 0 10px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.3;
      font-weight: 760;
    }

    .assistant-block p {
      margin: 0 0 14px;
    }

    .assistant-block ul,
    .assistant-block ol {
      margin: 0 0 18px;
      padding-left: 22px;
    }

    .assistant-block li {
      margin: 8px 0;
      padding-left: 4px;
    }

    .assistant-block strong {
      color: var(--ink);
      font-weight: 760;
    }

    .assistant-block code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #eef2f7;
      color: var(--ink);
      font-size: 0.92em;
    }

    .citation {
      border: 0;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--accent);
      padding: 2px 7px;
      font: inherit;
      font-size: 0.85em;
      font-weight: 800;
      vertical-align: baseline;
    }

    .source-panel {
      margin-top: 32px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .source-panel h2 {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .source-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.76);
      padding: 16px;
      margin-top: 12px;
    }

    .source-card.highlight {
      border-color: var(--accent);
      background: #eff6ff;
    }

    .source-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 760;
    }

    .source-meta {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    details.evidence {
      margin-top: 10px;
    }

    details.evidence summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .snippet {
      max-height: 240px;
      overflow: auto;
      margin-top: 8px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .copy-row {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .copy-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--muted);
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 12px 24px 22px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(247,248,250,0), rgba(247,248,250,0.78) 34%, #f7f8fa 82%);
    }

    .ask-form {
      width: min(100%, 720px);
      margin: 0 auto;
      pointer-events: auto;
    }

    .ask-box {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .mode-row {
      height: 29px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 8px;
      color: #4b5563;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .mode-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .input-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 0 12px 9px 16px;
    }

    .attach-button {
      width: 28px;
      height: 38px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    textarea {
      width: 100%;
      min-height: 38px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 7px 0;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.45;
      background: transparent;
    }

    textarea::placeholder {
      color: var(--muted);
      opacity: 0.94;
    }

    .send-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      background: #0f172a;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 150ms ease, opacity 150ms ease;
    }

    .send-button:hover {
      transform: translateY(-1px);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .dock-meta {
      width: min(100%, 720px);
      margin: 9px auto 0;
      display: flex;
      justify-content: center;
      gap: 28px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      pointer-events: auto;
    }

    .dock-meta span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .error-box {
      display: none;
      width: min(100%, 780px);
      margin: 10px auto 0;
      border: 1px solid #fecaca;
      border-radius: 12px;
      background: #fff1f2;
      padding: 12px 14px;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.45;
    }

    .error-box.visible {
      display: block;
    }

    .loading-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 0.9s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    @media (max-width: 900px) {
      .topbar {
        height: auto;
      }

      .topbar-inner {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 18px 22px;
      }

      .brand-group {
        justify-content: center;
      }

      .divider {
        display: none;
      }

      .source-tabs {
        order: 2;
      }

      .top-actions {
        position: absolute;
        right: 18px;
        top: 18px;
      }

      main {
        padding-top: 70px;
      }
    }

    @media (max-width: 720px) {
      .top-actions {
        display: none;
      }

      .source-tabs {
        width: 100%;
        gap: 8px;
      }

      .source-tab {
        flex: 1;
        min-width: 0;
      }

      .prompt-grid {
        grid-template-columns: 1fr;
      }

      .hero-copy {
        font-size: 16px;
        letter-spacing: 0.02em;
      }

      .input-dock {
        padding: 14px 14px 22px;
      }

      .dock-meta {
        display: none;
      }

      .input-row {
        grid-template-columns: 1fr auto;
        padding-left: 16px;
      }

      .attach-button {
        display: none;
      }

      .user-bubble {
        max-width: 100%;
      }
    }

    @media (max-width: 560px) {
      .source-tab {
        font-size: 13px;
        letter-spacing: 0.04em;
        padding: 0 12px;
      }

      main {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-group">
          <h1 class="brand-name">QuintScope</h1>
          <div class="divider"></div>
        </div>

        <nav class="source-tabs" aria-label="News source">
          <label class="source-tab active">
            <input type="radio" name="newsSource" value="sakal" data-label="esakal" checked />
            <span>ESAKAL</span>
          </label>

          <!-- <label class="source-tab">
            <input type="radio" name="newsSource" value="barandbench" data-label="Bar &amp; Bench" />
            <span>Bar &amp; Bench</span>
          </label> -->
        </nav>

        <div class="top-actions">
          <button class="icon-button" type="button" aria-label="History">
            <i data-lucide="history" width="20" height="20"></i>
          </button>

          <button class="icon-button" type="button" aria-label="Settings">
            <i data-lucide="settings" width="20" height="20"></i>
          </button>

          <div class="avatar" aria-hidden="true"></div>
        </div>
      </div>
    </header>

    <main>
      <section class="home" id="ask">
        <div class="hero">
          <div class="sparkle" aria-hidden="true">
            <i data-lucide="sparkles" width="24" height="24"></i>
          </div>

          <h1>Good morning.</h1>

          <p class="hero-copy">
            I've analysed verified stories across Quintype-powered publisher archives.<br />
            What news can I synthesise for you today?
          </p>
        </div>

        <div class="prompt-grid" id="promptGrid" aria-label="Suggested news queries"></div>

        <div class="chat-stream" id="chatStream" aria-live="polite"></div>
      </section>
    </main>

    <div class="input-dock">
      <form class="ask-form" id="questionForm">
        <div class="ask-box">
          <div class="mode-row">
            <span class="mode-dot"></span>
            <span>Research Mode</span>
          </div>

          <div class="input-row">
            <button class="attach-button" type="button" aria-label="Attach">
              <i data-lucide="paperclip" width="21" height="21"></i>
            </button>

            <textarea
              id="questionInput"
              maxlength="1000"
              rows="1"
              placeholder="Ask about any story, case, region or news topic..."
            ></textarea>

            <button class="send-button" id="sendButton" type="submit" aria-label="Send">
              <i data-lucide="arrow-up" width="22" height="22"></i>
            </button>
          </div>
        </div>

        <div class="error-box" id="errorBox"></div>
      </form>

      <div class="dock-meta">
        <span><i data-lucide="badge-check" width="15" height="15"></i> Verified Sources</span>
        <span><i data-lucide="braces" width="15" height="15"></i> Real-time Retrieval</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('questionForm');
    const input = document.getElementById('questionInput');
    const sendButton = document.getElementById('sendButton');
    const errorBox = document.getElementById('errorBox');
    const chatStream = document.getElementById('chatStream');
    const promptGrid = document.getElementById('promptGrid');
    const sourceInputs = Array.from(document.querySelectorAll('input[name="newsSource"]'));

    let currentRequestStartedAt = 0;
    let chatHistory = [];
    let turnCounter = 0;
    let activeTurnId = 0;

    const MAX_HISTORY_MESSAGES = 8;

    const promptSets = {
      sakal: [
        {
          icon: 'map-pinned',
          title: 'Pune Civic Pulse',
          description: 'Local administration, traffic and infrastructure from eSakal.',
          prompt: 'Find the latest esakal stories about Pune civic issues, traffic, infrastructure, or local administration.'
        },
        {
          icon: 'landmark',
          title: 'Maharashtra Politics',
          description: 'State decisions, parties and policy shifts from esakal.',
          prompt: 'Summarise recent esakal coverage on Maharashtra politics, state government decisions, and party developments.'
        },
        {
          icon: 'sprout',
          title: 'Rural Maharashtra',
          description: 'Farmers, rainfall, crop prices and rural coverage.',
          prompt: 'Find eSakal stories about agriculture, farmers, rainfall, crop prices, or rural Maharashtra.'
        },
        {
          icon: 'cloud-rain',
          title: 'Weather and Rainfall',
          description: 'Rain alerts, monsoon updates and district-level reports.',
          prompt: 'Find recent eSakal stories about rainfall, monsoon updates, weather warnings, or district-level rain conditions in Maharashtra.'
        },
        {
          icon: 'briefcase-business',
          title: 'Jobs and Education',
          description: 'Recruitment, exams, schools, colleges and students.',
          prompt: 'Find esakal stories about education, exams, recruitment, students, schools, colleges, or government job updates.'
        },
        {
          icon: 'building-2',
          title: 'City Development',
          description: 'Urban projects, roads, metro, civic works and planning.',
          prompt: 'Find esakal stories about city development, road works, metro projects, public infrastructure, or municipal planning.'
        }
      ],

      barandbench: [
        {
          icon: 'scale',
          title: 'Supreme Court Watch',
          description: 'Hearings, judgments and constitutional matters.',
          prompt: 'Find recent Bar & Bench stories about Supreme Court hearings, judgments, or important constitutional matters.'
        },
        {
          icon: 'shield-alert',
          title: 'ED and Bail Tracker',
          description: 'Agency cases, arrests, bail and PMLA proceedings.',
          prompt: 'Find Bar & Bench stories involving Enforcement Directorate cases, bail orders, arrests, or money laundering proceedings.'
        },
        {
          icon: 'gavel',
          title: 'High Court Brief',
          description: 'Rulings, PILs, disputes and judicial observations.',
          prompt: 'Find Bar & Bench coverage about High Court rulings, legal disputes, public interest litigation, or judicial observations.'
        },
        {
          icon: 'landmark',
          title: 'Constitution Bench',
          description: 'Constitutional questions and major legal interpretation.',
          prompt: 'Find Bar & Bench stories about Constitution Bench matters, constitutional interpretation, fundamental rights, or major legal questions.'
        },
        {
          icon: 'file-text',
          title: 'Case Timeline',
          description: 'Build a chronology from legal reporting.',
          prompt: 'Create a timeline from Bar & Bench stories about a major case, including hearings, orders, judgments, and reported developments.'
        },
        {
          icon: 'users',
          title: 'Judges and Courts',
          description: 'Judicial appointments, observations and court updates.',
          prompt: 'Find Bar & Bench stories about judges, judicial appointments, court observations, transfers, or court administration.'
        }
      ]
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function setLoading(isLoading) {
      sendButton.disabled = isLoading;
    }

    function resizeInput() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    }

    function ensureChatVisible() {
      chatStream.classList.add('visible');
    }

    function selectedSourceInput() {
      return sourceInputs.find(item => item.checked);
    }

    function selectedSource() {
      return selectedSourceInput()?.value || 'sakal';
    }

    function selectedSourceLabel() {
      return selectedSourceInput()?.dataset.label || 'esakal';
    }

    function updateSourceTabs() {
      sourceInputs.forEach(sourceInput => {
        const tab = sourceInput.closest('.source-tab');
        if (!tab) return;

        tab.classList.toggle('active', sourceInput.checked);
      });
    }

    function setSource(source) {
      const matchingSource = document.querySelector(`input[name="newsSource"][value="${source}"]`);
      if (!matchingSource) return;

      matchingSource.checked = true;
      chatHistory = [];
      updateSourceTabs();
      renderPromptCards();
    }

    function renderPromptCards() {
      const source = selectedSource();
      const prompts = promptSets[source] || promptSets.sakal;

      promptGrid.innerHTML = prompts.map(item => `
        <button class="prompt-card" type="button" data-prompt="${escapeHtml(item.prompt)}">
          <div class="prompt-card-head">
            <i data-lucide="${escapeHtml(item.icon)}" width="17" height="17"></i>
            <strong>${escapeHtml(item.title)}</strong>
          </div>
          <span>${escapeHtml(item.description)}</span>
        </button>
      `).join('');

      promptGrid.querySelectorAll('[data-prompt]').forEach(button => {
        button.addEventListener('click', () => {
          input.value = button.dataset.prompt;
          resizeInput();
          input.focus();
        });
      });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function trimHistory() {
      if (chatHistory.length > MAX_HISTORY_MESSAGES) {
        chatHistory = chatHistory.slice(-MAX_HISTORY_MESSAGES);
      }
    }

    function addUserMessage(question) {
      ensureChatVisible();

      const wrapper = document.createElement('div');
      wrapper.className = 'message';
      wrapper.innerHTML = `<div class="user-bubble">${escapeHtml(question)}</div>`;

      chatStream.appendChild(wrapper);
      wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function addThinkingBlock(turnId) {
      const block = document.createElement('details');
      block.className = 'process';
      block.open = true;
      block.id = `thinking-${turnId}`;

      block.innerHTML = `
        <summary>Working through the news stories <span class="loading-dot"></span></summary>
        <div class="process-list" id="live-process-${turnId}">
          <div class="process-item active">
            <div class="process-icon">◆</div>
            <div>
              <div class="process-name">Starting the story search</div>
              <div class="process-detail">I am sending your question into the selected ${escapeHtml(selectedSourceLabel())} workflow.</div>
            </div>
          </div>
        </div>
      `;

      chatStream.appendChild(block);
    }

    async function askQuestion(question) {
      clearError();

      turnCounter += 1;
      activeTurnId = turnCounter;

      const turnId = activeTurnId;

      addUserMessage(question);
      addThinkingBlock(turnId);
      setLoading(true);

      currentRequestStartedAt = performance.now();

      const requestHistory = chatHistory.slice(-MAX_HISTORY_MESSAGES);
      const source = selectedSource();

      chatHistory.push({ role: 'user', content: question });
      trimHistory();

      try {
        const response = await fetch('/chat/stream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            question,
            source,
            history: requestHistory,
          }),
        });

        if (!response.ok) {
          const detail = await response.text();
          throw new Error(detail || `Request failed with ${response.status}`);
        }

        const data = await readChatStream(response, turnId);

        chatHistory.push({
          role: 'assistant',
          content: data.message || '',
        });

        trimHistory();
      } catch (error) {
        removeThinkingBlock(turnId);
        showError(`Chat request failed: ${error.message}`);
        chatHistory.pop();
      } finally {
        setLoading(false);
      }
    }

    async function readChatStream(response, turnId) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      let buffer = '';
      let finalData = null;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const events = buffer.split('\n\n');
        buffer = events.pop() || '';

        for (const eventText of events) {
          const dataLine = eventText
            .split('\n')
            .find(line => line.startsWith('data: '));

          if (!dataLine) continue;

          const event = JSON.parse(dataLine.slice(6));

          if (event.kind === 'process') {
            appendLiveProcessNote(event.note, turnId);
          }

          if (event.kind === 'final') {
            finalData = event.response;
            renderResponse(finalData, turnId);
          }

          if (event.kind === 'error') {
            throw new Error(event.message || 'Streaming request failed.');
          }
        }
      }

      if (!finalData) {
        throw new Error('The workflow ended without a final answer.');
      }

      return finalData;
    }

    function appendLiveProcessNote(note, turnId) {
      const list = document.getElementById(`live-process-${turnId}`);
      if (!list || !note) return;

      [...list.querySelectorAll('.process-item.active')]
        .forEach(item => item.classList.remove('active'));

      const item = document.createElement('div');
      item.className = 'process-item active';

      item.innerHTML = `
        <div class="process-icon">◆</div>
        <div>
          <div class="process-name">${escapeHtml(note.title)}</div>
          <div class="process-detail">${escapeHtml(note.detail)}</div>
          ${renderNoteSourceButtons(note.source_numbers || [], turnId, false, note.sources || [])}
        </div>
      `;

      list.appendChild(item);
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function removeThinkingBlock(turnId) {
      const block = document.getElementById(`thinking-${turnId}`);
      if (block) block.remove();
    }

    function finalizeThinkingBlock(turnId, data, elapsed, sources) {
      const block = document.getElementById(`thinking-${turnId}`);
      if (!block) return null;

      block.querySelectorAll('.process-item.active')
        .forEach(item => item.classList.remove('active'));

      const summary = block.querySelector('summary');

      if (summary) {
        summary.textContent = processLabel(data.type, elapsed);
      }

      const list = block.querySelector('.process-list');

      if (list && sources.length) {
        list.insertAdjacentHTML('beforeend', renderSourceStrip(sources, turnId));
      }

      block.open = false;
      return block;
    }

    function renderResponse(data, turnId) {
      const elapsed = data.execution_time_seconds ?? ((performance.now() - currentRequestStartedAt) / 1000);
      const sources = data.sources || [];
      const processNotes = data.process_notes || [];

      const liveProcess = finalizeThinkingBlock(turnId, data, elapsed, sources);

      if (!liveProcess) {
        const process = document.createElement('details');
        process.className = 'process';
        process.open = false;

        process.innerHTML = `
          <summary>${processLabel(data.type, elapsed)}</summary>
          <div class="process-list">
            ${renderProcessNotes(processNotes, sources, turnId)}
            ${renderSourceStrip(sources, turnId)}
          </div>
        `;

        chatStream.appendChild(process);
      }

      const answer = document.createElement('article');
      answer.className = 'assistant-block';
      answer.innerHTML = renderAnswer(data.message || 'No response returned.', turnId);

      chatStream.appendChild(answer);

      if (sources.length) {
        chatStream.appendChild(renderSources(sources, turnId));
      }

      const copyRow = document.createElement('div');
      copyRow.className = 'copy-row';
      copyRow.innerHTML = '<button class="copy-button" type="button" aria-label="Copy answer">Copy answer</button>';

      copyRow.querySelector('button').addEventListener('click', () => {
        navigator.clipboard.writeText(data.message || '');
      });

      chatStream.appendChild(copyRow);
      answer.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function processLabel(type, elapsed) {
      if (type === 'out_of_scope') {
        return `Request checked in ${elapsed.toFixed(1)} seconds`;
      }

      if (type === 'clarification_needed') {
        return `Clarification check in ${elapsed.toFixed(1)} seconds`;
      }

      return `How this answer was built (${elapsed.toFixed(1)} seconds)`;
    }

    function renderProcessNotes(notes, sources, turnId) {
      if (!notes.length) {
        return `
          <div class="process-item">
            <div class="process-icon">◆</div>
            <div>
              <div class="process-name">Story check complete</div>
              <div class="process-detail">I checked the selected news source and prepared the response from available story material.</div>
            </div>
          </div>
        `;
      }

      return notes.map(note => `
        <div class="process-item">
          <div class="process-icon">◆</div>
          <div>
            <div class="process-name">${escapeHtml(note.title)}</div>
            <div class="process-detail">${escapeHtml(note.detail)}</div>
            ${renderNoteSourceButtons(note.source_numbers || [], turnId, true, sources)}
          </div>
        </div>
      `).join('');
    }

    function findSource(sourceNumber, sources) {
      return (sources || []).find(source => String(source.source_number) === String(sourceNumber));
    }

    function sourceChipLabel(sourceNumber, sources) {
      const source = findSource(sourceNumber, sources);
      const articleId = sourceArticleId(source);
      const title = source?.headline || `Source ${sourceNumber}`;
      return articleId ? `${articleId} · ${title}` : title;
    }

    function sourceArticleId(source) {
      return source?.article_id || source?.story_id || source?.id || '';
    }

    function sourceMark() {
      return selectedSource() === 'barandbench' ? 'B&B' : 'esakal';
    }

    function renderNoteSourceButtons(sourceNumbers, turnId, clickable, sources = []) {
      if (!sourceNumbers.length) return '';

      return `
        <div class="planning-pills">
          ${sourceNumbers.map(number => (
            clickable
              ? `<button class="source-chip" type="button" onclick="highlightSource('${turnId}', '${number}')">
                  <span class="mark">${escapeHtml(sourceMark())}</span>
                  <span>${escapeHtml(sourceChipLabel(number, sources))}</span>
                </button>`
              : `<span class="source-chip">
                  <span class="mark">${escapeHtml(sourceMark())}</span>
                  <span>${escapeHtml(sourceChipLabel(number, sources))}</span>
                </span>`
          )).join('')}
        </div>
      `;
    }

    function renderSourceStrip(sources, turnId) {
      if (!sources.length) return '';

      const chips = sources.map(source => `
        <button class="source-chip" type="button" onclick="highlightSource('${turnId}', '${source.source_number}')">
          <span class="mark">${escapeHtml(sourceMark())}</span>
          <span>${escapeHtml(sourceChipLabel(source.source_number, sources))}</span>
        </button>
      `).join('');

      return `
        <div class="process-item">
          <div class="process-icon">◆</div>
          <div>
            <div class="process-name">Stories I used</div>
            <div class="source-strip">${chips}</div>
          </div>
        </div>
      `;
    }

    function renderAnswer(message, turnId) {
      let text = escapeHtml(message || '');
      text = linkCitationsFromEscapedHtml(text, turnId);

      const lines = text.split('\n');
      let html = '';
      let inUl = false;
      let inOl = false;

      function closeLists() {
        if (inUl) {
          html += '</ul>';
          inUl = false;
        }

        if (inOl) {
          html += '</ol>';
          inOl = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          closeLists();
          continue;
        }

        if (/^###\s+/.test(line)) {
          closeLists();
          html += `<h3>${formatInline(line.replace(/^###\s+/, ''))}</h3>`;
          continue;
        }

        if (/^##\s+/.test(line)) {
          closeLists();
          html += `<h2>${formatInline(line.replace(/^##\s+/, ''))}</h2>`;
          continue;
        }

        if (/^#\s+/.test(line)) {
          closeLists();
          html += `<h2>${formatInline(line.replace(/^#\s+/, ''))}</h2>`;
          continue;
        }

        if (/^[-*]\s+/.test(line)) {
          if (!inUl) {
            closeLists();
            html += '<ul>';
            inUl = true;
          }

          html += `<li>${formatInline(line.replace(/^[-*]\s+/, ''))}</li>`;
          continue;
        }

        if (/^\d+\.\s+/.test(line)) {
          if (!inOl) {
            closeLists();
            html += '<ol>';
            inOl = true;
          }

          html += `<li>${formatInline(line.replace(/^\d+\.\s+/, ''))}</li>`;
          continue;
        }

        closeLists();
        html += `<p>${formatInline(line)}</p>`;
      }

      closeLists();
      return html;
    }

    function formatInline(html) {
      return html
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function renderSources(sources, turnId) {
      const panel = document.createElement('section');
      panel.className = 'source-panel';
      panel.innerHTML = '<h2>Sources</h2>';

      sources.forEach(source => {
        const card = document.createElement('article');
        card.className = 'source-card';
        card.id = `source-${turnId}-${source.source_number}`;
        const articleId = sourceArticleId(source);
        const publishedAt = source.published_at
          ? `Published ${escapeHtml(source.published_at)}`
          : 'Published date unavailable';
        const articleIdMeta = articleId
          ? `<span>Article ID ${escapeHtml(articleId)}</span>`
          : '<span>Article ID unavailable</span>';

        card.innerHTML = `
          <h3 class="source-title">[Source ${escapeHtml(source.source_number)}] ${escapeHtml(source.headline || 'Untitled')}</h3>
          <div class="source-meta">
            <span>${publishedAt}</span>
            ${articleIdMeta}
          </div>
          <details class="evidence">
            <summary>Read evidence</summary>
            <div class="snippet">${escapeHtml(source.match_snippet || '')}</div>
          </details>
        `;

        panel.appendChild(card);
      });

      return panel;
    }

    function linkCitationsFromEscapedHtml(html, turnId) {
      return html.replace(/\[Source\s+(\d+)\]/g, (match, sourceNumber) => {
        return `<button class="citation" type="button" onclick="highlightSource('${turnId}', '${sourceNumber}')">[Source ${sourceNumber}]</button>`;
      });
    }

    function highlightSource(turnId, sourceNumber) {
      const card = document.getElementById(`source-${turnId}-${sourceNumber}`);
      if (!card) return;

      const details = card.querySelector('details');
      if (details) details.open = true;

      card.classList.add('highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });

      window.setTimeout(() => card.classList.remove('highlight'), 1800);
    }

    sourceInputs.forEach(sourceInput => {
      sourceInput.addEventListener('change', () => {
        chatHistory = [];
        updateSourceTabs();
        renderPromptCards();
      });
    });

    form.addEventListener('submit', event => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      resizeInput();
      askQuestion(question);
    });

    input.addEventListener('input', resizeInput);

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    updateSourceTabs();
    renderPromptCards();
    resizeInput();

    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
