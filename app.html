<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News RAG AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner { border-top-color: #4f46e5; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .source-scroll::-webkit-scrollbar { width: 4px; }
        .source-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .source-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .highlight-card {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.35);
            transform: scale(1.01);
            border-color: #818cf8;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
            <div class="py-4 border-b-2 border-indigo-600 font-bold text-indigo-600">
                AI News Search
            </div>
            <a href="/docs" class="text-sm font-semibold text-gray-400 hover:text-indigo-600 transition-colors">API Docs</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <section class="space-y-6">
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="searchInput"
                        class="w-full text-xl p-6 pr-36 rounded-2xl border-2 border-gray-100 shadow-xl focus:border-indigo-500 outline-none transition-all"
                        placeholder="Ask about people, companies, courts, deals, events, or topics..."
                        onkeypress="if(event.key === 'Enter') executeChat()">
                    <button onclick="executeChat()" class="absolute right-3 top-3 bg-indigo-600 text-white font-bold px-8 py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition-all">
                        Ask
                    </button>
                </div>
            </div>

            <div id="searchLoader" class="hidden flex flex-col items-center py-20">
                <div class="spinner rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
                <p class="text-indigo-600 font-medium animate-pulse">Searching the newsroom...</p>
            </div>

            <div id="errorArea" class="hidden bg-red-50 border border-red-100 text-red-700 p-5 rounded-2xl font-medium"></div>

            <div id="resultArea" class="hidden fade-in space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                        <p class="text-[10px] uppercase font-bold text-indigo-400 mb-1 tracking-widest">Intent</p>
                        <p id="intentDisplay" class="text-sm font-bold text-indigo-900"></p>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 md:col-span-2">
                        <p class="text-[10px] uppercase font-bold text-purple-400 mb-1 tracking-widest">Search Query</p>
                        <p id="searchQueryDisplay" class="text-sm font-medium text-purple-900 font-mono break-words"></p>
                    </div>
                </div>

                <div id="entityPanel" class="hidden bg-white p-4 rounded-xl border border-gray-200">
                    <p class="text-[10px] uppercase font-bold text-gray-400 mb-2 tracking-widest">Detected Entities</p>
                    <div id="entityList" class="flex flex-wrap gap-2"></div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-gray-50 px-6 py-3 border-b border-gray-100 flex justify-between items-center">
                        <span id="answerLabel" class="text-xs font-bold text-gray-400 uppercase tracking-widest">Answer</span>
                        <div class="flex items-center gap-2">
                            <span id="execTime" class="text-xs text-gray-500 font-bold bg-white px-2 py-1 rounded"></span>
                            <span id="sourceCount" class="text-xs text-indigo-500 font-bold bg-indigo-50 px-2 py-1 rounded"></span>
                        </div>
                    </div>
                    <div id="answerText" class="p-8 text-lg leading-relaxed text-gray-800 whitespace-pre-wrap"></div>
                </div>

                <div id="traceSection" class="bg-white rounded-2xl border border-gray-200 p-6">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Process</h3>
                    <div id="traceList" class="space-y-3"></div>
                </div>

                <div id="sourceSection" class="space-y-4">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 ml-2">News Sources</h3>
                    <div id="sourceList" class="space-y-4"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = window.location.origin;

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        async function executeChat() {
            const queryInput = document.getElementById('searchInput');
            const question = queryInput.value.trim();
            if (!question) return;

            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('errorArea').classList.add('hidden');
            document.getElementById('searchLoader').classList.remove('hidden');

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    const detail = await response.text();
                    throw new Error(detail || `Request failed with ${response.status}`);
                }

                const data = await response.json();
                renderResponse(data);
            } catch (err) {
                const errorArea = document.getElementById('errorArea');
                errorArea.textContent = `Chat request failed: ${err.message}`;
                errorArea.classList.remove('hidden');
            } finally {
                document.getElementById('searchLoader').classList.add('hidden');
            }
        }

        function renderResponse(data) {
            const analysis = data.analysis || {};
            const sources = data.sources || [];

            document.getElementById('intentDisplay').textContent = analysis.intent || data.type || 'unknown';
            document.getElementById('searchQueryDisplay').textContent = analysis.search_query || '';
            document.getElementById('sourceCount').textContent = `${sources.length} source${sources.length === 1 ? '' : 's'}`;
            document.getElementById('execTime').textContent = data.execution_time_seconds ? `${data.execution_time_seconds}s` : '';
            document.getElementById('answerLabel').textContent = data.type === 'clarification_needed' ? 'Clarification Needed' : 'AI Response';
            document.getElementById('answerText').innerHTML = linkCitations(data.message || 'No response returned.');

            renderEntities(analysis.entities || []);
            renderTrace(data.steps || []);
            renderSources(sources);

            document.getElementById('resultArea').classList.remove('hidden');
        }

        function renderEntities(entities) {
            const panel = document.getElementById('entityPanel');
            const list = document.getElementById('entityList');
            list.innerHTML = '';

            if (!entities.length) {
                panel.classList.add('hidden');
                return;
            }

            entities.forEach(entity => {
                const badge = document.createElement('span');
                badge.className = 'bg-gray-100 text-gray-700 text-xs font-bold px-3 py-1 rounded-full';
                badge.textContent = entity;
                list.appendChild(badge);
            });

            panel.classList.remove('hidden');
        }

        function renderTrace(steps) {
            const section = document.getElementById('traceSection');
            const list = document.getElementById('traceList');
            list.innerHTML = '';

            if (!steps.length) {
                section.classList.add('hidden');
                return;
            }

            steps.forEach((step, index) => {
                const item = document.createElement('div');
                item.className = 'flex gap-3 items-start';
                item.innerHTML = `
                    <div class="mt-0.5 h-6 w-6 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs font-bold">${index + 1}</div>
                    <div>
                        <p class="text-sm font-bold text-gray-800">${escapeHtml(step.name)}</p>
                        ${step.detail ? `<p class="text-sm text-gray-500 mt-0.5">${escapeHtml(step.detail)}</p>` : ''}
                    </div>
                `;
                list.appendChild(item);
            });

            section.classList.remove('hidden');
        }

        function renderSources(sources) {
            const list = document.getElementById('sourceList');
            list.innerHTML = '';

            if (!sources.length) {
                list.innerHTML = '<p class="text-gray-400 italic ml-2">No sources returned.</p>';
                return;
            }

            sources.forEach((source, index) => {
                const num = index + 1;
                const card = document.createElement('div');
                card.id = `source-card-${num}`;
                card.className = 'bg-white rounded-2xl border border-gray-200 overflow-hidden transition-all duration-500';
                card.innerHTML = `
                    <details class="group">
                        <summary class="p-6 cursor-pointer flex justify-between items-center hover:bg-gray-50 transition-colors gap-4">
                            <div class="flex items-center gap-4 min-w-0">
                                <span class="bg-indigo-100 text-indigo-600 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase shrink-0">Source ${num}</span>
                                <h4 class="font-bold text-gray-800 truncate">${escapeHtml(source.headline || 'Untitled')}</h4>
                            </div>
                            <span class="text-indigo-400 group-open:rotate-180 transition-transform shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </span>
                        </summary>
                        <div class="px-8 pb-8 pt-2">
                            ${source.summary ? `<p class="text-sm text-gray-500 mb-4">${escapeHtml(source.summary)}</p>` : ''}
                            <div class="max-h-[320px] overflow-y-auto source-scroll pr-4 text-gray-600 leading-relaxed whitespace-pre-line text-sm border-t border-gray-100 pt-6">${escapeHtml(source.match_snippet || '')}</div>
                            ${source.story_id ? `<p class="mt-4 text-[10px] uppercase tracking-widest text-gray-300 font-bold">Story ID: ${escapeHtml(source.story_id)}</p>` : ''}
                        </div>
                    </details>
                `;
                list.appendChild(card);
            });
        }

        function linkCitations(message) {
            const escaped = escapeHtml(message);
            return escaped.replace(/\[Source (\d+(?:,\s*\d+)*)\]/g, (match, group) => {
                const links = group.split(',').map(value => {
                    const sourceNumber = value.trim();
                    return `<a href="#source-card-${sourceNumber}" onclick="highlightSource(${sourceNumber})" class="text-indigo-600 font-bold hover:underline">[${sourceNumber}]</a>`;
                });
                return links.join(', ');
            });
        }

        function highlightSource(num) {
            const card = document.getElementById(`source-card-${num}`);
            if (!card) return;

            const details = card.querySelector('details');
            if (details) details.open = true;

            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('highlight-card');
            setTimeout(() => card.classList.remove('highlight-card'), 2200);
        }
    </script>
</body>
</html>
